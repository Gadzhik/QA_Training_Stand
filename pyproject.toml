[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-kit-pro"
version = "2.0.0"
description = "Professional Multi-Protocol QA Environment"
requires-python = ">=3.11"
readers = ["README.md"]
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    # Protocols
    "strawberry-graphql>=0.219.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "aiokafka>=0.10.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "faker>=23.0.0",
    "allure-pytest>=2.13.2"
]

[tool.ruff]
line-length = 120
exclude = ["services/core/protos/*", "tests/protos/*"]
